<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Афиша А4 — Турнир NOVA Street & River Уфа 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b1120;
    font-family: 'Manrope', -apple-system, sans-serif;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 20px 40px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ПАНЕЛЬ ПЕЧАТИ */
  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #0f172a;
    border-bottom: 1px solid #334155;
    padding: 14px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 1000;
    box-shadow: 0 4px 25px rgba(0,0,0,0.6);
  }
  .btn-print {
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    border: none;
    padding: 10px 22px;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn-print:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }
  .btn-download {
    background: #059669;
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn-download:hover {
    background: #047857;
    transform: translateY(-1px);
  }
  .hint {
    font-size: 13px;
    color: #94a3b8;
  }

  /* КОНТЕЙНЕР А4 */
  .poster-container {
    width: 210mm;
    max-width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    display: flex;
  }
  .poster-img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  @media print {
    .toolbar { display: none !important; }
    body {
      background: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .poster-container {
      width: 100% !important;
      height: 100vh !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      page-break-after: avoid;
    }
    .poster-img {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    Распечатать А4 (Ctrl + P)
  </button>
  <a href="/nova_poster_a4.jpg" download="NOVA_Poster_A4_Ufa_2026.jpg" class="btn-download">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    Скачать оригинал JPG
  </a>
  <span class="hint">Формат А4 для размещения в магазине «РЫБАЛЮБ» (ул. Айская, 46)</span>
</div>

<div class="poster-container">
  <img src="/nova_poster_a4.jpg" alt="Афиша А4 турнира NOVA Street & River Уфа 2026" class="poster-img">
</div>

</body>
</html>
